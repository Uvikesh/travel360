<div class="flex items-center gap-2 mb-6">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">travel_explore</span>
<span class="font-display-lg text-display-lg text-on-primary drop-shadow-md">travel360</span>

<p class="font-body-lg text-body-lg text-surface-container-low max-w-md">
                    Your premium gateway to professional travel management and exclusive global discoveries.
                </p>
</div>

<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-8 lg:p-24 bg-surface">
<div class="w-full max-w-[420px] space-y-8">
<!-- Mobile Branding (Visible only when left side is hidden) -->
<div class="flex items-center gap-2 lg:hidden mb-12">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">travel_explore</span>
<span class="font-headline-md text-headline-md text-primary tracking-tight">travel360</span>
</div>
<!-- Form Header -->
<div class="space-y-2">
<h1 class="font-headline-md text-headline-md text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-full shadow-sm font-label-sm text-label-sm text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" type="submit">

                    </button>

<p class="font-body-md text-body-md text-on-surface-variant">

</p>
