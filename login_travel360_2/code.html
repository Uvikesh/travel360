<body class="bg-surface text-on-surface antialiased min-h-screen flex w-full">
<!-- Split Screen Layout -->
<div class="flex flex-col md:flex-row w-full min-h-screen">
<!-- Left Side: Immersive Image -->
<div class="hidden md:flex flex-col md:w-1/2 relative bg-surface-variant h-screen">
<div class="absolute inset-0 bg-cover bg-center w-full h-full z-0" data-alt="A breathtaking, immersive photograph of a luxury beachfront resort at sunset. The sky is painted with vibrant hues of orange, pink, and deep purple, reflecting off the calm, crystal-clear ocean waters. Silhouetted palm trees gently sway in the breeze. The scene evokes a sense of premium relaxation, warmth, and high-end travel experiences, perfectly aligning with a modern, professional corporate aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDjfwJRRJCNiyc9Z7-9j68yS64i62NzQ5pxl6hvQMPZR01Xwo04NqTdO9E8FugFVs68QotJXxnRk4HBmlRAI5PYEfC_-K4SQcnPe6gXo9darJxtPVaamdY1b1XB0No_Aa7F1lwCGbfio377OEgN7avRQTMbQHO62mZA_4yiq4UqTK2oXSkkvxezPdVLx5-ac-hlE4yNh2zb4mXnNc8MgR5gpzwR-0Ri9_C7LmwkVGql9_cayViIGkh2')"></div>
<!-- Overlay for text readability -->
<div class="absolute inset-0 bg-black/20 z-10"></div>
<div class="relative z-20 p-margin-desktop flex flex-col justify-between h-full">
<!-- Brand Logo -->
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-white text-display-lg" style="font-variation-settings: 'FILL' 1;">travel</span>
<h1 class="text-white font-display-lg text-display-lg font-bold tracking-tight">Travel360</h1>
</div>
<div class="max-w-md">
<p class="text-white/90 font-headline-sm text-headline-sm font-medium mb-4">Discover the world's most exclusive destinations.</p>
<p class="text-white/80 font-body-lg text-body-lg">Your premium gateway to curated travel experiences and global expertise.</p>
</div>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface h-screen">
<div class="w-full max-w-md space-y-xl">
<!-- Mobile Brand Logo (Visible only on small screens) -->
<div class="md:hidden flex items-center justify-center gap-sm mb-lg">
<span class="material-symbols-outlined text-primary text-display-lg-mobile" style="font-variation-settings: 'FILL' 1;">travel</span>
<h1 class="text-primary font-display-lg-mobile text-display-lg-mobile font-bold tracking-tight">Travel360</h1>
</div>
<!-- Header -->
<div class="text-center md:text-left space-y-xs">
<h2 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Form -->
<form class="space-y-md">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-sm py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-primary transition-shadow sm:text-sm shadow-sm" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-primary transition-shadow sm:text-sm shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-sm flex items-center cursor-pointer">
<button aria-label="Toggle password visibility" class="text-outline hover:text-on-surface-variant focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between pt-xs">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-md text-label-md text-on-surface-variant" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-container font-medium transition-colors" href="#">
                                Forgot password?
                            </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md font-medium text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                            Log In
                        </button>
</div>
</form>
<!-- Footer Text -->
<div class="text-center pt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-label-md text-label-md text-primary hover:text-primary-container font-medium transition-colors" href="#">Register</a>
</p>
</div>
</div>
</div>
</div>
</body></html>
